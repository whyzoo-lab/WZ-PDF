<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WZ Reader</title>
    <meta name="description" content="WZ Reader — free, in-browser viewer for PDF, HWP, Word, PowerPoint, Excel, mail and images. Open ?url=… to view a document inline; add ?embed=1 for a chrome-less embedded viewer." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WZ Reader" />
    <!--
      First-paint shell. The entry bundle has to be fetched, parsed and executed
      before React can render anything, and on a cold start that reliably varies
      (measured in the packaged app: 69 ms on a warm cache, but up to ~1.8 s when
      the OS/AV has to fault the files in). Until then #root is empty, so the
      window sat as a dark void for that whole time — which is what "sometimes it
      takes ages to come up" actually looked like.

      This markup ships inside the HTML, so it paints on the first frame, with no
      extra request. It deliberately mirrors the real shell — the dark tool rail
      down the left (along the bottom on a phone) and the 32px title bar in the
      page background's colour — so when React mounts and replaces it there is
      no flash, just the controls arriving. createRoot() clears #root on its
      first render, so no cleanup is needed.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #111827; }
      #boot { display: flex; height: 100vh; height: 100dvh; }
      #boot .rail { width: 52px; flex: none; background: #111827; -webkit-app-region: drag; }
      #boot .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #boot .bar {
        height: 32px; flex: none; background: #e6e7ea;
        display: flex; align-items: center; justify-content: center;
        font: 500 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #6b7280; -webkit-app-region: drag;
      }
      #boot .body { flex: 1; display: flex; align-items: center; justify-content: center; background: #e6e7ea; }
      #boot .spin {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid #9ca3af; border-top-color: transparent;
        animation: boot-spin .7s linear infinite;
      }
      @media (max-width: 599px) {
        #boot { flex-direction: column-reverse; }
        #boot .rail { width: auto; height: 52px; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="rail"></div><div class="main"><div class="bar">WZ Reader</div><div class="body"><span class="spin"></span></div></div></div></div>
    <noscript>
      WZ Reader is a free, in-browser document viewer and editor. JavaScript is required to run the app.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
