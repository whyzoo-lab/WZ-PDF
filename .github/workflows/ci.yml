name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The MCP server's tests run with everyone else's (vitest picks up
      # mcp/src/*.test.ts), and they import its own dependencies.
      - name: Install MCP dependencies
        run: npm ci --prefix mcp

      - name: Lint
        run: npm run lint

      - name: Type-check (renderer + electron)
        run: |
          npx tsc -b --noEmit
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Test
        run: npm run test:run

      - name: Build (web)
        run: npm run build

  mcp:
    name: MCP server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Build MCP server
        working-directory: mcp
        run: npm run build
