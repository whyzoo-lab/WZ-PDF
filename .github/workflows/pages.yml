name: Deploy Pages

# Publish the web build to GitHub Pages on every push to main.
# (The internal-server deploy.bat path still works; this is an additional,
#  public, HTTPS target — required for OCR, which rejects file:// origins.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build (web + OCR) and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # OCR assets (~56 MB) are gitignored. Cache them keyed on the build script
      # + lockfile (the ort wasm is copied from node_modules), so we hit Baidu
      # CDN / HuggingFace only when those change. This avoids slow re-downloads
      # and the anonymous-HF rate limiting (429) we hit when Pages + Release
      # raced. The cache is OS-independent, so Pages (ubuntu) and Release
      # (windows) share it — whichever populates it first spares the others.
      - name: Cache OCR assets
        id: ocr-cache
        uses: actions/cache@v4
        with:
          path: public/ocr
          # Key on the build script only — NOT package-lock.json. A version bump
          # changes the lockfile on every release and would needlessly bust this
          # cache (re-downloading from Baidu/HuggingFace, risking the 429). The
          # `v1` epoch: bump it when upgrading onnxruntime-web (its wasm is copied
          # from node_modules and isn't captured by the script hash).
          key: ocr-assets-v1-${{ hashFiles('scripts/build-ocr-assets.py') }}

      # Only download/regenerate on a cache miss. setup:ocr needs pyyaml; the
      # ort wasm is pulled from node_modules (hence after `npm ci`).
      - name: Build OCR assets
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        run: |
          pip install pyyaml
          npm run setup:ocr

      - name: Build (web)
        run: npm run build

      # configure-pages with enablement turns Pages on (source = Actions) if it
      # isn't already; harmless once enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
