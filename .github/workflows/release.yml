name: Release

# Trigger by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # OCR assets (~56 MB) are gitignored, so regenerate them in CI before
      # build:exe bundles public/ — otherwise the released installer ships
      # without OCR. setup:ocr needs pyyaml; the ort wasm comes from node_modules.
      - name: Build OCR assets
        run: |
          pip install pyyaml
          npm run setup:ocr

      - name: Build portable + NSIS installer
        run: npm run build:exe

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Attach both the portable exe and the NSIS installer.
          files: |
            release/WZ_PDF_*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
