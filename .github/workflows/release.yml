name: Release

# Trigger by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes with git; the build's dependencies need not
          # find a write token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # electron-builder downloads Electron and its packaging tools (7zip, NSIS,
      # NSIS resources, winCodeSign, icons) from GitHub release assets on every
      # build. Those downloads 504'd four times in a row on 1.29.10 while
      # githubstatus said all was well, each time at a different file. Caching
      # them takes the downloads off the release path; the retry below covers a
      # cache miss. Restored before `npm ci`, whose electron postinstall uses
      # %LOCALAPPDATA%\electron\Cache as well.
      - name: Electron versions for the cache key
        id: eb-versions
        shell: bash
        run: |
          echo "key=$(node -p "const p=require('./package-lock.json').packages;[p['node_modules/electron'].version,p['node_modules/electron-builder'].version].join('-')")" >> "$GITHUB_OUTPUT"

      # Saved under a per-run key (cache keys cannot be overwritten) and restored
      # by prefix, so a run that failed half-way still keeps what it downloaded.
      - name: Restore Electron download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-dl-v1-${{ steps.eb-versions.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            electron-dl-v1-${{ steps.eb-versions.outputs.key }}-
            electron-dl-v1-

      - name: Install dependencies
        run: npm ci

      # OCR assets (~56 MB) are gitignored. Cache them (shared with the Pages
      # workflow — same OS-independent key) so build:exe bundles public/ with
      # OCR without re-downloading from Baidu CDN / HuggingFace every release,
      # which previously raced the Pages run and got rate-limited (429).
      - name: Cache OCR assets
        id: ocr-cache
        uses: actions/cache@v4
        with:
          path: public/ocr
          # Key on the build script only — NOT package-lock.json (see pages.yml):
          # a version bump changes the lockfile every release and would bust this
          # cache. Bump the `v1` epoch when upgrading onnxruntime-web.
          key: ocr-assets-v1-${{ hashFiles('scripts/build-ocr-assets.py') }}

      # Only download/regenerate on a cache miss — otherwise the released
      # installer would ship without OCR. setup:ocr needs pyyaml; the ort wasm
      # comes from node_modules.
      - name: Build OCR assets
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        run: |
          pip install pyyaml==6.0.3
          npm run setup:ocr

      # Up to three attempts. A download that completed stays in the cache folder,
      # so each attempt starts past the files the last one got.
      - name: Build portable + NSIS installer
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            npm run build:exe
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) {
              Write-Host "::warning::build:exe failed (attempt $i of $attempts), retrying in 60 s"
              Start-Sleep -Seconds 60
            }
          }
          exit 1

      - name: Save Electron download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-dl-v1-${{ steps.eb-versions.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create GitHub Release and upload artifacts
        # A commit, not the movable v2 tag: this step holds the write token to
        # the release that every installed copy updates from. (v2 = this SHA.)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # Both exes, plus what automatic updates read: latest.yml names the
          # newest installer and its sha512 (installed copies check this file),
          # and the .blockmap lets a later update download only what changed.
          # Without latest.yml on a release, installed apps never see it.
          files: |
            release/WZ_Reader_*.exe
            release/latest.yml
            release/WZ_Reader_Setup_*.exe.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
